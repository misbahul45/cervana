user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------- Logging --------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    # -------- Performance --------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    # -------- Compression --------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml
        font/woff
        font/woff2;

    # -------- Upstreams (untuk healthcheck & load balancing) --------
    upstream cervana_api {
        server api:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream cervana_ai_api {
        server ai-api:3003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream cervana_web {
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream cervana_admin {
        server admin:3001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # -------- Map for proxy headers --------
    map $http_x_forwarded_proto $orig_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # -------- Shared proxy settings --------
    # Dipakai oleh semua location block di bawah.
    # Definisi sebagai variabel? Tidak bisa. Pakai include file.
    include /etc/nginx/conf.d/*.conf;

    # -------- Default server --------
    server {
        listen      80 default_server;
        server_name cervana _;

        # Endpoint health untuk docker healthcheck
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Security headers (global)
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # ---- Frontend siswa (Nuxt) ----
        location / {
            proxy_pass         http://cervana_web;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       off;
        }

        # ---- Frontend admin (SvelteKit) ----
        location /admin {
            proxy_pass         http://cervana_admin;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            # Rewrite trailing-slash ke root biar tidak double-slash
            rewrite ^/admin$ /admin/ permanent;
        }

        location /admin/ {
            proxy_pass         http://cervana_admin/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        # ---- Backend API utama (NestJS) ----
        location /api/ {
            proxy_pass         http://cervana_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;   # longer for AI/embedding ops
            proxy_read_timeout    300s;
        }

        # ---- AI API (FastAPI) ----
        location /ai/ {
            proxy_pass         http://cervana_ai_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            # SSE butuh buffering off & timeout panjang
            proxy_buffering       off;
            proxy_cache           off;
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # ---- Static assets caching ----
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://cervana_web;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}