name: reducera

services:
  postgres:
    image: postgres:15-alpine
    container_name: reducera_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reducera}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reducera}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reducera_network

  redis:
    image: redis:7-alpine
    container_name: reducera_redis
    restart: unless-stopped
    env_file:
      - .env
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - reducera_network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: reducera_qdrant
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - reducera_network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: reducera_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://reducera_prod:change_me_strong_random_password_min_24_chars@postgres:5432/reducera}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT_INTERNAL:-6379}
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3002}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_URL: ${ADMIN_URL}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      COOKIE_SECRET: ${COOKIE_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_AI_API_SECRET: ${INTERNAL_AI_API_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      PAYMENT_INTENT_TTL_MINUTES: ${PAYMENT_INTENT_TTL_MINUTES:-1440}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-10}
      MANUAL_PAYMENT_MAX_SUBMISSIONS: ${MANUAL_PAYMENT_MAX_SUBMISSIONS:-5}
      MANUAL_PAYMENT_ACCOUNTS: ${MANUAL_PAYMENT_ACCOUNTS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ARCJET_KEY: ${ARCJET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/v1/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - reducera_network

  ai-api:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
    container_name: reducera_ai_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3003
      APP_VERSION: ${APP_VERSION:-v1}
      NEST_API: ${NEST_API:-http://api:3002/api/v1}
      INTERNAL_AI_API_SECRET: ${INTERNAL_AI_API_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-reducera-embedding}
      QDRANT_MEMORY_COLLECTION: ${QDRANT_MEMORY_COLLECTION:-reducera-memory}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_FLASH: ${OPENAI_MODEL_FLASH:-gpt-4.1-mini}
      OPENAI_MODEL_THINKING: ${OPENAI_MODEL_THINKING:-gpt-5-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-8192}
      OPENAI_THINKING_MAX_TOKENS: ${OPENAI_THINKING_MAX_TOKENS:-16000}
      OPENAI_FLASH_TEMPERATURE: ${OPENAI_FLASH_TEMPERATURE:-}
      HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL:-BAAI/bge-m3}
      HF_EMBEDDING_URL: ${HF_EMBEDDING_URL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      RESOURCE_ALLOWLIST_HOSTS: ${RESOURCE_ALLOWLIST_HOSTS:-}
      RESOURCE_ALLOWLIST_SCHEMES: ${RESOURCE_ALLOWLIST_SCHEMES:-https}
      RESOURCE_ALLOWLIST_LOCAL: ${RESOURCE_ALLOWLIST_LOCAL:-false}
      AI_API_RATE_LIMIT: ${AI_API_RATE_LIMIT:-60}
      AI_API_RATE_BURST: ${AI_API_RATE_BURST:-10}
      WEB_URL: ${WEB_URL:-http://web:3000}
      ADMIN_URL: ${ADMIN_URL}
      HF_TOKEN: ${HF_TOKEN}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${AI_API_PORT:-3003}:3003"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - reducera_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: reducera_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NUXT_PUBLIC_AI_URL: ${NUXT_PUBLIC_AI_URL:-http://localhost/ai/v1}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://api:3002}
      AI_API_INTERNAL_URL: ${AI_API_INTERNAL_URL:-http://ai-api:3003}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NITRO_PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - reducera_network

  nginx:
    image: nginx:1.27-alpine
    container_name: reducera_nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      ai-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - reducera_network

networks:
  reducera_network:
    driver: bridge
    name: reducera_network

volumes:
  postgres_data:
    name: reducera_postgres_data
  redis_data:
    name: reducera_redis_data
  qdrant_data:
    name: reducera_qdrant_data
  nginx_logs:
    name: reducera_nginx_logs