user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml
        font/woff
        font/woff2;

    upstream reducera_api {
        server api:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream reducera_ai_api {
        server ai-api:3003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream reducera_web {
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    map $http_x_forwarded_proto $orig_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    include /etc/nginx/conf.d/*.conf;

    server {
        listen      80 default_server;
        server_name reducera _;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:3002 http://localhost:3003 https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            proxy_pass         http://reducera_web;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       off;
        }

        location /api/ {
            limit_req zone=api_ip  burst=20 nodelay;
            limit_req zone=api_user burst=5  nodelay;
            location /api/v1/docs {
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
                proxy_pass         http://reducera_api/api/v1/docs;
            }
            proxy_pass         http://reducera_api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location /ai/ {
            limit_req zone=ai_ip   burst=4  nodelay;
            limit_req zone=ai_user burst=2  nodelay;
            proxy_pass         http://reducera_ai_api/ai/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $orig_scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_buffering       off;
            proxy_cache           off;
            proxy_connect_timeout 10s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"message":"Too Many Requests","error":{"code":"RATE_LIMITED"},"meta":{"requestId":"$request_id","timestamp":"$time_iso8601"}}';
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://reducera_web;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
