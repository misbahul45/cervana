# Connection upgrade mapping (untuk WebSocket / SSE)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Client IP real (kalau ada CDN/proxy di depan)
real_ip_header X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
# Phase 9: per-IP and per-token rate limiting
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;
limit_req_zone $http_authorization zone=api_user:10m rate=2r/s;
