map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

real_ip_header X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;

limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;
limit_req_zone $http_authorization zone=api_user:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ai_ip:10m  rate=2r/s;
limit_req_zone $http_authorization zone=ai_user:10m  rate=1r/s;

limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
