name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ownership-rules:
    name: Service ownership rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check service ownership rules
        run: bash scripts/check-ownership-rules.sh

  api-tests:
    name: api tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci_test_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: ci_test_refresh_secret_minimum_32_characters_long
      COOKIE_SECRET: ci_test_cookie_secret_long
      INTERNAL_AI_API_SECRET: ci_test_internal_secret_long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: services/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: services/api
      - run: pnpm prisma migrate deploy
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: pnpm jest --silent
        working-directory: services/api